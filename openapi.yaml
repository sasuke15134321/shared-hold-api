openapi: 3.0.0
info:
  title: Shared Hold API
  version: 0.1.0
  description: |
    SQLite-backed shared boundary storage for AI agents.
    POST /hold stores a UTF-8 payload (paid: 0.005 USDC).
    GET /hold/{id} retrieves by hold_id (free).
    GET /hold lists all stored item metadata (free).

    Payloads are stored with SHA-256 integrity verification. GET is always non-destructive
    and idempotent — there is no restore, release, or state transition.

    **Payment**: For POST /hold only. Include X-PAYMENT or PAYMENT-SIGNATURE header with a valid
    x402 v2 payment (0.005 USDC on Base / eip155:8453). Without payment, the server returns HTTP 402.

paths:
  /hold:
    post:
      summary: Hold — Store payload to shared boundary (paid: 0.005 USDC)
      operationId: hold
      tags:
        - Core
      description: |
        Stores UTF-8 payload as bytes in the shared SQLite boundary.
        Returns a receipt with hold_id, SHA-256 content_hash, size, and created_at timestamp.
        Charged at 0.005 USDC per successful hold via x402.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payload
                - created_by
              properties:
                payload:
                  type: string
                  description: "UTF-8 text to store. Encoded as bytes internally."
                  example: "Agent checkpoint: task complete at 2026-09-17T12:00:00Z"
                created_by:
                  type: string
                  minLength: 1
                  description: "Identifier for the caller (agent ID, name, or any non-empty string)."
                  example: "agent-001"
      responses:
        '200':
          description: Hold receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldReceipt'
        '402':
          description: "Payment Required — include X-PAYMENT or PAYMENT-SIGNATURE header"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'
        '422':
          description: "Validation error"

    get:
      summary: Discover — List all stored items (free)
      operationId: discover
      security: []
      tags:
        - Core
      description: |
        Returns metadata for all stored items: hold_id, created_at, created_by, content_hash, size.
        Payload bytes are not included. Free, no payment required.
      responses:
        '200':
          description: List of stored items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HoldMetadata'
                  total:
                    type: integer

  /hold/{hold_id}:
    get:
      summary: Get — Retrieve stored payload by ID (free)
      operationId: get_hold
      security: []
      tags:
        - Core
      description: |
        Returns the stored UTF-8 payload for the given hold_id.
        Free, non-destructive, and idempotent — same hold_id always returns the same payload.
      parameters:
        - name: hold_id
          in: path
          required: true
          schema:
            type: string
          description: "The hold_id returned by POST /hold"
      responses:
        '200':
          description: Stored payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold_id:
                    type: string
                  payload:
                    type: string
        '404':
          description: "hold_id not found"

  /health:
    get:
      summary: Health check (free)
      operationId: health
      tags:
        - Ops
      responses:
        '200':
          description: Service health status

  /.well-known/x402.json:
    get:
      summary: x402 endpoint discovery (free)
      operationId: x402_discovery
      tags:
        - Ops
      responses:
        '200':
          description: x402 payment endpoint metadata

components:
  schemas:
    HoldReceipt:
      type: object
      properties:
        hold_id:
          type: string
          description: "Unique identifier for this hold"
        content_hash:
          type: string
          description: "SHA-256 hex digest of the stored payload bytes"
        size:
          type: integer
          description: "Byte length of the stored payload"
        created_at:
          type: string
          format: date-time
          description: "UTC ISO 8601 timestamp"
        created_by:
          type: string
          description: "Caller identifier as provided"

    HoldMetadata:
      type: object
      properties:
        hold_id:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        content_hash:
          type: string
        size:
          type: integer

    PaymentRequired:
      type: object
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
          example: "Payment required"
        resource:
          type: object
        accepts:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: string
                example: "exact"
              network:
                type: string
                example: "eip155:8453"
              amount:
                type: string
                example: "5000"
              asset:
                type: string
                example: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
              payTo:
                type: string
                example: "0x60c402878EfcEcAe5733A88075328Aa2320C39BE"
              maxTimeoutSeconds:
                type: integer
                example: 300
