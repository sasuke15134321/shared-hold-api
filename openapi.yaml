openapi: 3.0.0
info:
  title: Shared Hold API
  version: 0.1.0
  description: 'SQLite-backed capability-protected storage for AI agents.

    POST /hold costs 0.005 USDC via x402 on Base (eip155:8453).

    POST returns a one-time access_token; only its SHA-256 hash is stored.

    GET /hold/{hold_id} is free but requires X-Hold-Token.

    Missing or invalid tokens return HTTP 404.

    GET /hold returns public service capabilities only.

    Retrieval is non-destructive and idempotent.

    '
paths:
  /hold:
    post:
      summary: 'Hold — Store payload to shared boundary (paid: 0.005 USDC)'
      operationId: hold
      tags:
      - Core
      description: Store UTF-8 payload via x402 for 0.005 USDC. Returns a receipt containing an access_token.
        The caller must retain this bearer capability securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payload
              - created_by
              properties:
                payload:
                  type: string
                  description: UTF-8 text to store. Encoded as bytes internally.
                  example: 'Agent checkpoint: task complete at 2026-09-17T12:00:00Z'
                created_by:
                  type: string
                  minLength: 1
                  description: Identifier for the caller (agent ID, name, or any non-empty string).
                  example: agent-001
      responses:
        '200':
          description: Hold receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldReceipt'
        '402':
          description: Payment Required — include X-PAYMENT or PAYMENT-SIGNATURE header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'
        '422':
          description: Validation error
    get:
      summary: Discover public service capabilities (free)
      operationId: discover
      security: []
      tags:
      - Core
      description: Returns service capabilities only; no stored IDs, metadata, payloads, or counts.
      responses:
        '200':
          description: Public service capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                - service
                - hold_supported
                - get_requires_token
                - retrieval_payment_required
                properties:
                  service:
                    type: string
                  hold_supported:
                    type: boolean
                  get_requires_token:
                    type: boolean
                  retrieval_payment_required:
                    type: boolean
  /hold/{hold_id}:
    get:
      summary: Retrieve payload using capability token (free)
      operationId: get_hold
      security: []
      tags:
      - Core
      description: Requires the X-Hold-Token capability issued by POST /hold. Missing or invalid tokens
        return HTTP 404. Authorized retrieval is non-destructive and idempotent.
      parameters:
      - name: hold_id
        in: path
        required: true
        schema:
          type: string
        description: The hold_id returned by POST /hold
      - name: X-Hold-Token
        in: header
        required: false
        schema:
          type: string
        description: Required for successful retrieval; omission returns 404, not 422.
      responses:
        '200':
          description: Stored payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold_id:
                    type: string
                  payload:
                    type: string
        '404':
          description: Not found, missing token, or invalid token
  /health:
    get:
      summary: Health check (free)
      operationId: health
      tags:
      - Ops
      responses:
        '200':
          description: Service health status
  /.well-known/x402.json:
    get:
      summary: x402 endpoint discovery (free)
      operationId: x402_discovery
      tags:
      - Ops
      responses:
        '200':
          description: x402 payment endpoint metadata
components:
  schemas:
    HoldReceipt:
      type: object
      properties:
        hold_id:
          type: string
          description: Unique identifier for this hold
        content_hash:
          type: string
          description: SHA-256 hex digest of the stored payload bytes
        size:
          type: integer
          description: Byte length of the stored payload
        created_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp
        created_by:
          type: string
          description: Caller identifier as provided
        access_token:
          type: string
          description: Bearer capability returned at creation. Only its SHA-256 hash is stored.
      required:
      - access_token
    HoldMetadata:
      type: object
      properties:
        hold_id:
          type: string
        created_at:
          type: string
        created_by:
          type: string
        content_hash:
          type: string
        size:
          type: integer
    PaymentRequired:
      type: object
      properties:
        x402Version:
          type: integer
          example: 2
        error:
          type: string
          example: Payment required
        resource:
          type: object
        accepts:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: string
                example: exact
              network:
                type: string
                example: eip155:8453
              amount:
                type: string
                example: '5000'
              asset:
                type: string
                example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
              payTo:
                type: string
                example: '0x60c402878EfcEcAe5733A88075328Aa2320C39BE'
              maxTimeoutSeconds:
                type: integer
                example: 300
